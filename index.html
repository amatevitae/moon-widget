<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon Phase Widget</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#070e1c;color:#e7e9f1}*{box-sizing:border-box}body{margin:0}.widget{width:100%;min-height:100vh;padding:clamp(12px,5vw,30px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 35%,#293447 0%,#101b2e 53%,#030917 100%)}.phase{font:600 clamp(12px,4.5vw,24px)/1.3 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}.moon{display:block;width:min(90%,340px);height:auto;margin:clamp(12px,5vw,25px) auto;filter:drop-shadow(0 0 12px #d9e5ff18)}.illumination{font:200 clamp(36px,15vw,86px)/1.1 system-ui,sans-serif;letter-spacing:-.06em}.details{font:400 clamp(12px,3.4vw,19px)/1.6 system-ui,sans-serif;margin-top:12px}.date{font:400 clamp(11px,3vw,16px)/1.5 system-ui,sans-serif;margin-top:18px;color:#c6ccdb}.transits{width:100%;max-width:440px;margin-top:24px;padding-top:18px;border-top:1px solid #9da9c044;text-align:left}.transits-title{text-align:center;font:600 clamp(12px,3.8vw,17px) system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}.planet{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #9da9c01b;font:clamp(12px,3.3vw,16px) system-ui,sans-serif}.planet-name{white-space:nowrap}.planet-position{text-align:right;color:#c6ccdb}.retro{color:#e2b98c}.transits-status{font:12px system-ui,sans-serif;color:#9da9c0;text-align:center}.note{font:11px system-ui,sans-serif;color:#9da9c0;margin-top:12px}canvas{width:100%;height:100%}
</style>
</head><body><main class="widget"><div class="phase" id="phase">calculating moon phase…</div><div class="moon"><canvas id="moon" width="480" height="480" role="img" aria-label="moon phase illustration"></canvas></div><div class="illumination" id="illum">—</div><div class="details" id="zodiac"></div><div class="date" id="date"></div><section class="transits" aria-label="current planetary positions"><div class="transits-title">✦ planetary transits ✦</div><div id="planet-list" class="transits-status">calculating current positions…</div></section><div class="note">approximate astronomical values · tropical zodiac</div></main>
<script>
// SunCalc-style low-precision astronomy; calculated locally, no API key.
const rad=Math.PI/180, dayMs=86400000, J1970=2440588, J2000=2451545;
function toDays(d){return d.getTime()/dayMs-0.5+J1970-J2000}
function sunCoords(d){let M=rad*(357.5291+0.98560028*d), C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)), L=M+C+rad*(102.9372+180);return {ra:Math.atan2(Math.sin(L)*Math.cos(rad*23.4397),Math.cos(L)),dec:Math.asin(Math.sin(L)*Math.sin(rad*23.4397)),L}}
function moonCoords(d){let L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d),l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F),dist=385001-20905*Math.cos(M);return {ra:Math.atan2(Math.sin(l)*Math.cos(rad*23.4397)-Math.tan(b)*Math.sin(rad*23.4397),Math.cos(l)),dec:Math.asin(Math.sin(b)*Math.cos(rad*23.4397)+Math.cos(b)*Math.sin(rad*23.4397)*Math.sin(l)),dist,l,b}}
function calc(date){let d=toDays(date),s=sunCoords(d),m=moonCoords(d),sd=149598000,phi=Math.acos(Math.max(-1,Math.min(1,Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra)))),inc=Math.atan2(sd*Math.sin(phi),m.dist-sd*Math.cos(phi)),angle=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra)),fraction=(1+Math.cos(inc))/2,phase=(0.5+0.5*inc*(angle<0?-1:1)/Math.PI)%1;return {fraction,phase,longitude:((m.l/rad)%360+360)%360}}
function phaseName(p){if(p<.025||p>=.975)return 'new moon';if(p<.225)return 'waxing crescent';if(p<.275)return 'first quarter';if(p<.475)return 'waxing gibbous';if(p<.525)return 'full moon';if(p<.725)return 'waning gibbous';if(p<.775)return 'last quarter';return 'waning crescent'}
function fullMoonTitle(date){let month=date.getUTCMonth();return ['wolf moon','snow moon','worm moon','pink moon','flower moon','strawberry moon','buck moon','sturgeon moon','harvest / corn moon','hunter’s moon','beaver moon','cold moon'][month]}
function drawMoon(fraction,phase){let c=document.getElementById('moon'),ctx=c.getContext('2d'),w=c.width,h=c.height,r=210,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();let litRight=phase<.5;let k=2*fraction-1;let img=ctx.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let dx=(x-cx)/r,dy=(y-cy)/r,rr=dx*dx+dy*dy;if(rr>1)continue;let z=Math.sqrt(1-rr),light=(litRight?dx:-dx)*Math.sqrt(Math.max(0,1-k*k))+z*(-k);let illuminated=light>0;let seed=Math.sin(x*.13+y*.17)+Math.sin(x*.037-y*.067)+Math.sin(x*.071+y*.043);let crater=Math.sin((x*0.09)**2+(y*.09)**2);let texture=seed*10+crater*3;let limb=Math.max(.55,z);let base=illuminated?(178+texture)*limb:8+Math.max(0,texture*.08);let i=(y*w+x)*4;img.data[i]=Math.max(0,base*.95);img.data[i+1]=Math.max(0,base);img.data[i+2]=Math.max(0,base*1.08);img.data[i+3]=255}ctx.putImageData(img,0,0);ctx.restore();ctx.strokeStyle='#b6c1d044';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}
function render(){let now=new Date(),m=calc(now),name=phaseName(m.phase),z=['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'][Math.floor(m.longitude/30)%12];document.getElementById('phase').textContent=name==='full moon'?`full moon · ${fullMoonTitle(now)}`:name;document.getElementById('illum').textContent=`${Math.round(m.fraction*100)}%`;document.getElementById('zodiac').textContent=`☾ moon in ${z}`;document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/London'}).format(now);drawMoon(m.fraction,m.phase)}render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(render,60000);
// Planet positions use Astronomy Engine, loaded from a CDN; no API key required.
const planetInfo=[['Sun','☉','sun'],['Mercury','☿','mercury'],['Venus','♀','venus'],['Mars','♂','mars'],['Jupiter','♃','jupiter'],['Saturn','♄','saturn'],['Uranus','♅','uranus'],['Neptune','♆','neptune'],['Pluto','♇','pluto']];
const zodiacSigns=['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'];
function planetLongitude(body,date){let vec=Astronomy.GeoVector(body,date,true);return Astronomy.Ecliptic(vec).elon}
function angleDiff(a,b){return ((a-b+540)%360)-180}
function renderPlanets(){let holder=document.getElementById('planet-list');if(!window.Astronomy){holder.textContent='planetary positions unavailable while offline';return}try{let now=new Date(),before=new Date(now.getTime()-12*3600000),after=new Date(now.getTime()+12*3600000);holder.className='';holder.replaceChildren();for(let [body,symbol,label] of planetInfo){let longitude=planetLongitude(body,now),signIndex=Math.floor(longitude/30)%12,degree=longitude%30,retro=body!=='Sun'&&angleDiff(planetLongitude(body,after),planetLongitude(body,before))<0;let row=document.createElement('div');row.className='planet';let left=document.createElement('span');left.className='planet-name';left.textContent=`${symbol} ${label}${retro?' ℞':''}`;if(retro)left.classList.add('retro');let right=document.createElement('span');right.className='planet-position';let deg=Math.floor(degree),mins=Math.floor((degree-deg)*60);right.textContent=`${zodiacSigns[signIndex]} ${deg}°${String(mins).padStart(2,'0')}′`;row.append(left,right);holder.append(row)}}catch(e){holder.className='transits-status';holder.textContent='unable to calculate planetary positions'}}
function loadAstronomy(){let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.js';script.onload=()=>{renderPlanets();setInterval(renderPlanets,60000)};script.onerror=()=>{document.getElementById('planet-list').textContent='planetary positions unavailable: check internet connection'};document.head.append(script)}
loadAstronomy();
</script></body></html>
