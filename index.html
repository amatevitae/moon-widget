
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire Moon Widget</title>
<style>
:root {
  color-scheme: dark;
  font-family: Georgia, serif;
  background: #000;
  color: #f6eedb;
}
* { box-sizing: border-box; }
body { margin: 0; background: #000; }
.widget {
  width: 100%;
  min-height: 100vh;
  padding: 20px clamp(12px, 4vw, 30px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.phase {
  font: 600 clamp(12px, 3.5vw, 20px)/1.4 system-ui, sans-serif;
  letter-spacing: .13em;
  text-transform: uppercase;
}
.moon-art {
  width: min(100%, 350px);
  margin: 12px auto;
}
.moon-art svg { width: 100%; height: auto; display: block; }
.illum {
  font: 200 clamp(42px, 13vw, 82px)/1.1 system-ui, sans-serif;
  letter-spacing: -.06em;
}
.zodiac {
  margin-top: 10px;
  font: 400 clamp(12px, 3.2vw, 17px) system-ui, sans-serif;
}
.date {
  margin-top: 15px;
  color: #d6cbb6;
  font-size: clamp(12px, 3vw, 16px);
}
.transits {
  width: 100%;
  max-width: 440px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid #bfa67c44;
}
.transits-title {
  margin-bottom: 12px;
  font: 600 clamp(12px, 3.4vw, 16px) system-ui, sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.planet {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid #bfa67c20;
  font: clamp(12px, 3vw, 15px) system-ui, sans-serif;
}
.planet-position { text-align: right; color: #d6cbb6; }
.retro { color: #e6b777; }
.note {
  margin-top: 12px;
  color: #978c7c;
  font: 10px system-ui, sans-serif;
}
</style>
</head>
<body>
<main class="widget">
  <div class="phase" id="phase">calculating moon phase...</div>

  <div class="moon-art">
    <svg viewBox="0 0 360 360" role="img" aria-label="Cartoon moon with stars">
      <defs>
        <clipPath id="moonCircle">
          <circle cx="180" cy="180" r="115"/>
        </clipPath>
        <mask id="phaseMask" maskUnits="userSpaceOnUse"
              x="0" y="0" width="360" height="360">
          <rect width="360" height="360" fill="black"/>
          <path id="litShape" fill="white"/>
        </mask>
      </defs>

      <!-- subtle golden stars -->
      <g fill="#e8c47b" opacity=".9">
        <path d="M50 100 L54 112 L66 116 L54 120 L50 132 L46 120 L34 116 L46 112Z"/>
        <path d="M302 75 L306 89 L320 93 L306 97 L302 111 L298 97 L284 93 L298 89Z"/>
        <path d="M312 258 L315 268 L325 271 L315 274 L312 284 L309 274 L299 271 L309 268Z"/>
        <path d="M63 270 L66 280 L76 283 L66 286 L63 296 L60 286 L50 283 L60 280Z"/>
        <path d="M175 27 L178 37 L188 40 L178 43 L175 53 L172 43 L162 40 L172 37Z"/>
        <circle cx="95" cy="55" r="2"/>
        <circle cx="260" cy="43" r="2.5"/>
        <circle cx="335" cy="170" r="2"/>
        <circle cx="25" cy="210" r="2"/>
        <circle cx="250" cy="320" r="2"/>
        <circle cx="108" cy="322" r="1.8"/>
      </g>

      <!-- dark side of the moon -->
      <circle cx="180" cy="180" r="115" fill="#211b19"/>

      <!-- illuminated cartoon moon -->
      <g mask="url(#phaseMask)" clip-path="url(#moonCircle)">
        <circle cx="180" cy="180" r="115" fill="#f8e9bb"/>
        <circle cx="180" cy="180" r="110"
                fill="none" stroke="#ead39a" stroke-width="5"/>

        <!-- craters -->
        <g fill="#e6c98e" opacity=".65">
          <circle cx="112" cy="126" r="19"/>
          <circle cx="246" cy="117" r="13"/>
          <circle cx="112" cy="241" r="12"/>
          <circle cx="253" cy="238" r="22"/>
          <circle cx="166" cy="88" r="8"/>
          <circle cx="211" cy="267" r="9"/>
          <circle cx="274" cy="180" r="7"/>
          <circle cx="95" cy="184" r="6"/>
          <circle cx="158" cy="284" r="5"/>
        </g>
        <g fill="none" stroke="#c8a46e"
           stroke-width="2.5" opacity=".6">
          <ellipse cx="112" cy="126" rx="19" ry="14"
                   transform="rotate(-25 112 126)"/>
          <ellipse cx="253" cy="238" rx="19" ry="14"
                   transform="rotate(30 253 238)"/>
          <ellipse cx="246" cy="117" rx="13" ry="9"
                   transform="rotate(15 246 117)"/>
          <ellipse cx="112" cy="241" rx="12" ry="8"/>
        </g>

        <!-- little crater freckles -->
        <g fill="#cfae78" opacity=".65">
          <circle cx="145" cy="107" r="2.5"/>
          <circle cx="223" cy="98" r="3"/>
          <circle cx="271" cy="157" r="2"/>
          <circle cx="101" cy="207" r="2"/>
          <circle cx="222" cy="284" r="2.5"/>
        </g>

        <!-- sleepy eyes -->
        <g stroke="#34271f" stroke-width="3.5"
           fill="none" stroke-linecap="round">
          <path d="M130 174 Q148 190 166 174"/>
          <path d="M194 174 Q212 190 230 174"/>
          <path d="M140 181 L137 187"/>
          <path d="M151 183 L151 189"/>
          <path d="M205 183 L205 189"/>
          <path d="M220 181 L223 187"/>
          <path d="M176 219 Q180 224 184 219"/>
          <path d="M160 231 Q180 250 200 231"/>
        </g>

        <!-- rosy cheeks -->
        <circle cx="123" cy="210" r="15"
                fill="#f1aa91" opacity=".55"/>
        <circle cx="237" cy="210" r="15"
                fill="#f1aa91" opacity=".55"/>
      </g>
    </svg>
  </div>

  <div class="illum" id="illum">—</div>
  <div class="zodiac" id="zodiac"></div>
  <div class="date" id="date"></div>

  <section class="transits">
    <div class="transits-title">✦ planetary transits ✦</div>
    <div id="planet-list">calculating positions...</div>
  </section>

  <div class="note">approximate astronomical values · tropical zodiac</div>
</main>

<script>
const rad = Math.PI / 180;
const dayMs = 86400000;
const signs = [
  'aries','taurus','gemini','cancer','leo','virgo',
  'libra','scorpio','sagittarius','capricorn','aquarius','pisces'
];

function days(date) {
  return date.getTime() / dayMs - 0.5 + 2440588 - 2451545;
}

function sunCoords(d) {
  const M = rad * (357.5291 + 0.98560028 * d);
  const C = rad * (
    1.9148 * Math.sin(M) +
    0.02 * Math.sin(2*M) +
    0.0003 * Math.sin(3*M)
  );
  const L = M + C + rad * (102.9372 + 180);
  return {
    ra: Math.atan2(
      Math.sin(L)*Math.cos(rad*23.4397), Math.cos(L)
    ),
    dec: Math.asin(Math.sin(L)*Math.sin(rad*23.4397))
  };
}

function moonCoords(d) {
  const L = rad * (218.316 + 13.176396*d);
  const M = rad * (134.963 + 13.064993*d);
  const F = rad * (93.272 + 13.229350*d);
  const l = L + rad*6.289*Math.sin(M);
  const b = rad*5.128*Math.sin(F);
  const dist = 385001 - 20905*Math.cos(M);
  return {
    ra: Math.atan2(
      Math.sin(l)*Math.cos(rad*23.4397) -
      Math.tan(b)*Math.sin(rad*23.4397),
      Math.cos(l)
    ),
    dec: Math.asin(
      Math.sin(b)*Math.cos(rad*23.4397) +
      Math.cos(b)*Math.sin(rad*23.4397)*Math.sin(l)
    ),
    dist, l
  };
}

function moonData(date) {
  const d = days(date);
  const s = sunCoords(d);
  const m = moonCoords(d);
  const sd = 149598000;

  const phi = Math.acos(Math.max(-1,Math.min(1,
    Math.sin(s.dec)*Math.sin(m.dec) +
    Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra)
  )));

  const inc = Math.atan2(
    sd*Math.sin(phi),
    m.dist-sd*Math.cos(phi)
  );

  const angle = Math.atan2(
    Math.cos(s.dec)*Math.sin(s.ra-m.ra),
    Math.sin(s.dec)*Math.cos(m.dec) -
    Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra)
  );

  return {
    fraction: (1+Math.cos(inc))/2,
    phase: (0.5+0.5*inc*(angle<0?-1:1)/Math.PI)%1,
    longitude: ((m.l/rad)%360+360)%360
  };
}

function phaseName(p) {
  if(p<.025 || p>=.975) return 'new moon';
  if(p<.225) return 'waxing crescent';
  if(p<.275) return 'first quarter';
  if(p<.475) return 'waxing gibbous';
  if(p<.525) return 'full moon';
  if(p<.725) return 'waning gibbous';
  if(p<.775) return 'last quarter';
  return 'waning crescent';
}

function fullMoonTitle(date) {
  return [
    'wolf moon','snow moon','worm moon','pink moon',
    'flower moon','strawberry moon','buck moon',
    'sturgeon moon','harvest / corn moon','hunter’s moon',
    'beaver moon','cold moon'
  ][date.getMonth()];
}

// Draw a geometrically illuminated disc using an SVG mask.
function drawMoon(fraction, phase) {
  const r = 115, cx = 180, cy = 180;
  const k = 2*fraction-1;
  const waxing = phase < .5;
  const side = waxing ? 1 : -1;
  const points = [];

  // Walk the outer semicircle on the lit side.
  for(let i=0;i<=100;i++) {
    const a = -Math.PI/2 + Math.PI*i/100;
    const x = cx + side*r*Math.cos(a);
    const y = cy + r*Math.sin(a);
    points.push([x,y]);
  }

  // Return along the terminator.
  for(let i=100;i>=0;i--) {
    const a = -Math.PI/2 + Math.PI*i/100;
    const x = cx - side*k*r*Math.cos(a);
    const y = cy + r*Math.sin(a);
    points.push([x,y]);
  }

  const path = points.map((p,i)=>
    `${i===0?'M':'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`
  ).join(' ')+' Z';

  document.getElementById('litShape').setAttribute('d',path);
}

function renderMoon() {
  const now = new Date();
  const m = moonData(now);
  const name = phaseName(m.phase);
  const sign = signs[Math.floor(m.longitude/30)%12];

  document.getElementById('phase').textContent =
    name==='full moon'
      ? `full moon · ${fullMoonTitle(now)}`
      : name;

  document.getElementById('illum').textContent =
    `${Math.round(m.fraction*100)}%`;

  document.getElementById('zodiac').textContent =
    `☾ moon in ${sign}`;

  document.getElementById('date').textContent =
    new Intl.DateTimeFormat('en-GB',{
      weekday:'long',day:'numeric',month:'long',
      year:'numeric',timeZone:'Europe/London'
    }).format(now);

  drawMoon(m.fraction,m.phase);
}

const planets = [
  ['Sun','☉'],['Mercury','☿'],['Venus','♀'],
  ['Mars','♂'],['Jupiter','♃'],['Saturn','♄'],
  ['Uranus','♅'],['Neptune','♆'],['Pluto','♇']
];

function longitude(body,date) {
  return Astronomy.Ecliptic(
    Astronomy.GeoVector(body,date,true)
  ).elon;
}

function angleDiff(a,b) {
  return ((a-b+540)%360)-180;
}

function renderPlanets() {
  const holder = document.getElementById('planet-list');

  if(!window.Astronomy) {
    holder.textContent = 'planetary positions unavailable';
    return;
  }

  try {
    const now = new Date();
    const before = new Date(now.getTime()-43200000);
    const after = new Date(now.getTime()+43200000);
    holder.replaceChildren();

    for(const [body,symbol] of planets) {
      const lon = longitude(body,now);
      const sign = signs[Math.floor(lon/30)%12];
      const degree = lon%30;
      const deg = Math.floor(degree);
      const min = Math.floor((degree-deg)*60);

      const retro = body!=='Sun' &&
        angleDiff(
          longitude(body,after),
          longitude(body,before)
        ) < 0;

      const row = document.createElement('div');
      row.className = 'planet';

      const left = document.createElement('span');
      left.textContent =
        `${symbol} ${body.toLowerCase()}${retro?' ℞':''}`;
      if(retro) left.className = 'retro';

      const right = document.createElement('span');
      right.className = 'planet-position';
      right.textContent =
        `${sign} ${deg}°${String(min).padStart(2,'0')}′`;

      row.append(left,right);
      holder.append(row);
    }
  } catch(e) {
    holder.textContent = 'unable to calculate positions';
  }
}

renderMoon();
setInterval(renderMoon,60000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) {
    renderMoon();
    renderPlanets();
  }
});

const script = document.createElement('script');
script.src =
  'https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.js';
script.onload = ()=>{
  renderPlanets();
  setInterval(renderPlanets,60000);
};
script.onerror = ()=>{
  document.getElementById('planet-list').textContent =
    'planetary positions unavailable while offline';
};
document.head.append(script);
</script>
</body>
</html>
